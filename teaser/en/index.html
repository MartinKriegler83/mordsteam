@font-face{font-family:'Fraunces';font-weight:900;font-display:swap;src:url(/assets/fonts/fraunces-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:'Fraunces';font-weight:700;font-display:swap;src:url(/assets/fonts/fraunces-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:swap;src:url(/assets/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:400;font-display:swap;src:url(/assets/fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2')}
:root{--paper:#F3EFE6;--ink:#15171C;--red:#B3261E;--muted:#5A5D66}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;text-align:center}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 16px 24px}
.lupe{width:clamp(96px,22vw,150px);height:auto;margin-bottom:22px}
.lupe .dot{transform-origin:14px 14px;animation:puls 3.2s ease-in-out infinite}
@keyframes puls{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){.lupe .dot{animation:none}}
h1{margin:0;font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:clamp(40px,11vw,96px);letter-spacing:.02em;line-height:1}
h1 .r{color:var(--red)}
.soon{margin:26px 0 0;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:clamp(13px,2.6vw,16px);letter-spacing:.35em;text-transform:uppercase;color:var(--red);padding-left:.35em}
.frage{margin:14px 0 0;font-family:'Fraunces',Georgia,serif;font-weight:700;font-style:italic;font-size:clamp(20px,4.4vw,28px);color:var(--ink)}
.lang{position:absolute;top:16px;right:16px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;letter-spacing:.12em}
.lang a,.lang b{display:inline-block;padding:8px 6px;color:var(--muted);text-decoration:none}
.lang b{color:var(--ink);font-weight:500}
.lang a:hover{color:var(--red)}
footer{padding:20px 16px 28px;font-size:13px;color:var(--muted)}
.nl{display:inline-block;margin:26px 0 0;background:var(--red);color:#fff;text-decoration:none;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:500;font-size:clamp(14px,3vw,17px);letter-spacing:.22em;text-transform:uppercase;padding:14px 26px 14px 30px;border-radius:4px;box-shadow:0 6px 16px rgba(179,38,30,.25);transition:transform .15s,box-shadow .15s}
.nl:hover,.nl:focus-visible{transform:translateY(-2px);box-shadow:0 10px 22px rgba(179,38,30,.32)}
.nl small{display:block;margin-top:6px;font-size:.62em;letter-spacing:.12em;text-transform:none;opacity:.9}
footer a{color:var(--muted);margin:0 8px}
</style>
</head>
