# Stündlich: Friends-Runden im Wochenmodus auflösen (Mail an den Organisator).
# Einmal am Tag (ca. 9 Uhr Wien) zusätzlich: fällige Feedback-Mails verschicken.
# Benötigt das Repository-Secret CRON_KEY (gleicher Wert wie die Cloudflare-Variable CRON_KEY).
name: Feedback-Mails
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Fällige Auflösungen und Feedback-Mails anstoßen
        run: |
          curl -fsS -X POST -H "x-cron-key: ${{ secrets.CRON_KEY }}" "https://mordsteam.com/api/shop/cron${{ github.event_name == 'workflow_dispatch' && '?alles=1' || '' }}"
