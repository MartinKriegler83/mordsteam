<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geschenkkarte – Mordsteam</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
/* Geschenkkarte als Ermittlungsakte, ein volles A4-Blatt hochkant (Druck oder „Als PDF sichern“).
   Alle Maße in cqw (1cqw = 1 % der Blattbreite = 2,1 mm auf A4) – Bildschirm und Druck sehen gleich aus. */
.gk-bar{max-width:820px;margin:24px auto 0;padding:0 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.gk-bar p{margin:0;color:var(--ink-2);font-size:15px;max-width:560px}
.gk-wrap{max-width:820px;margin:18px auto 48px;padding:0 16px}
.gk-msg{max-width:720px;margin:60px auto;padding:0 16px;text-align:center}
.gk-sheet{container-type:inline-size;width:100%}
.gk{position:relative;aspect-ratio:210/297;overflow:hidden;background:var(--paper);color:var(--ink);box-shadow:0 14px 40px rgba(21,23,28,.18);
  display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* Kopf: dunkle Leiste wie auf der Website */
.gk-head{background:var(--ink);color:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:3cqw 6cqw}
.gk-wm{display:flex;align-items:center;gap:1.6cqw;font-family:'Fraunces',serif;font-weight:900;font-size:4.4cqw;letter-spacing:.06em}
.gk-wm svg{width:4.6cqw;height:4.6cqw}
.gk-wm .r{color:#E0463C}
.gk-az{font-family:'IBM Plex Mono',monospace;font-size:1.7cqw;letter-spacing:.22em;text-transform:uppercase;text-align:right;line-height:1.5;opacity:.85}
/* Aktenreiter */
.gk-tabrow{display:flex;gap:1.2cqw;padding:0 6cqw;margin-top:-.2cqw}
.gk-tab{background:var(--folder);font-family:'IBM Plex Mono',monospace;font-size:1.55cqw;letter-spacing:.2em;text-transform:uppercase;padding:1cqw 2.2cqw 1.1cqw;border-radius:0 0 1cqw 1cqw}
.gk-tab.red{background:var(--red);color:#fff}
.gk-body{flex:1;padding:4.4cqw 6cqw 0;display:flex;flex-direction:column;gap:2.5cqw;position:relative}
.gk-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:1.8cqw;letter-spacing:.3em;text-transform:uppercase;color:var(--red)}
.gk-title{font-family:'Fraunces',serif;font-weight:900;font-size:7.6cqw;line-height:.98;margin:1cqw 0 0;max-width:66cqw;text-wrap:balance}
.gk-sub{font-size:2.05cqw;color:var(--ink-2);margin:1.2cqw 0 0;max-width:86cqw}
/* Gummistempel */
.gk-stamp{position:absolute;right:5cqw;top:3.6cqw;transform:rotate(-11deg);border:.7cqw double var(--red);color:var(--red);border-radius:1.2cqw;
  padding:1.4cqw 2.6cqw;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:500;opacity:.9}
.gk-top.has-cover{display:grid;grid-template-columns:minmax(0,1fr) 21cqw;gap:3cqw;align-items:start}
.gk-top.has-cover .gk-title{font-size:6.8cqw}
.gk-cover{width:100%;height:auto;display:block;transform:rotate(3deg);box-shadow:0 1.2cqw 2.4cqw rgba(21,23,28,.3);margin-top:3.5cqw}
.gk:has(.gk-cover) .gk-stamp{display:none} /* Titelbild trägt schon den Stempel; „Geschenk“ steht im Reiter */
.gk.has-promo .gk-top.has-cover{grid-template-columns:minmax(0,1fr) 17cqw}
.gk.has-promo .gk-cover{margin-top:1.5cqw}
.gk-stamp b{display:block;font-size:4.2cqw;letter-spacing:.18em;line-height:1}
.gk-stamp span{display:block;font-size:1.35cqw;letter-spacing:.25em;margin-top:.8cqw}
/* Widmung: „Für“ und „Von“ wie ein Formular, dazwischen eine angeheftete Karteikarte */
.gk-field{display:grid;grid-template-columns:15cqw 1fr;align-items:end;gap:2cqw}
.gk-field label{font-family:'IBM Plex Mono',monospace;font-size:1.6cqw;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);padding-bottom:.8cqw}
.gk-field input{-webkit-appearance:none;appearance:none;font-family:'Fraunces',serif;font-weight:700;font-size:4cqw;color:var(--ink);background:var(--paper);border:0;border-bottom:.25cqw solid var(--ink);padding:.4cqw .2cqw;width:100%;min-width:0;border-radius:0}
.gk-card{position:relative;background:#FFFDF8;margin:.6cqw 3cqw .6cqw 17cqw;padding:3.6cqw 4cqw 2cqw;transform:rotate(-1.2deg);box-shadow:0 .6cqw 1.6cqw rgba(21,23,28,.14)}
.gk-card::before{content:"";position:absolute;left:0;right:0;top:2.4cqw;border-top:.18cqw solid var(--red)}
.gk-card::after{content:"";position:absolute;top:-1.6cqw;left:50%;width:14cqw;height:3.4cqw;transform:translateX(-50%) rotate(2deg);background:rgba(214,194,155,.7)}
.gk-card textarea{display:block;width:100%;box-sizing:border-box;border:0;background:transparent;resize:none;font-family:'Fraunces',serif;font-style:italic;font-size:2.9cqw;line-height:4.4cqw;color:var(--ink);height:13.2cqw;padding:0;overflow:hidden;-webkit-appearance:none;appearance:none;border-radius:0;
  /* Linien ohne „transparent“ (Safari druckt transparente Verläufe schwarz) */
  background-color:#FFFDF8;background-image:linear-gradient(to bottom,#FFFDF8 4.2cqw,#DDD5C4 4.2cqw);background-size:100% 4.4cqw;background-repeat:repeat-y}
/* Beweisstück: Anhänger mit Code + QR-Code */
.gk-evid{display:grid;grid-template-columns:1fr 22cqw;gap:4cqw;align-items:center;margin-top:.6cqw}
.gk-tag{position:relative;background:#FFFDF8;border:.25cqw solid var(--ink);padding:2.4cqw 3.2cqw 2.4cqw 9cqw;clip-path:polygon(5cqw 0,100% 0,100% 100%,5cqw 100%,0 50%);min-width:0}
.gk-tag::before{content:"";position:absolute;left:4.2cqw;top:50%;width:2.4cqw;height:2.4cqw;margin-top:-1.2cqw;border-radius:50%;border:.25cqw solid var(--ink);background:var(--paper)}
.gk-tag small{display:block;font-family:'IBM Plex Mono',monospace;font-size:1.55cqw;letter-spacing:.24em;text-transform:uppercase;color:var(--red)}
.gk-code{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:6cqw;letter-spacing:.14em;margin-top:.8cqw;white-space:nowrap}
.gk-tag p{margin:.8cqw 0 0;font-size:1.9cqw;color:var(--ink-2)}
.gk-link{display:block;margin-top:.8cqw;font-family:'IBM Plex Mono',monospace;font-size:2.2cqw;font-weight:500;color:var(--red);text-decoration:none;overflow-wrap:anywhere}
.gk-link.big{font-size:3cqw;margin-top:1.2cqw}
.gk-qr{display:block}
.gk-qrbox{text-align:center}
.gk-qr{background:#fff;padding:1.6cqw;border:.25cqw solid var(--ink);box-shadow:1cqw 1cqw 0 var(--ink)}
.gk-qr svg{display:block;width:100%;height:auto}
.gk-qrbox span{display:block;margin-top:1.8cqw;font-family:'IBM Plex Mono',monospace;font-size:1.45cqw;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
/* Teams-Gutschein auf Geschenk-Codes aus dem Admin */
.gk-promo{display:grid;grid-template-columns:auto 1fr;gap:.4cqw 3cqw;align-items:center;border:.25cqw dashed var(--red);background:#FFFDF8;padding:1.8cqw 3cqw;margin-top:-.4cqw}
.gk-promo small{grid-column:1/-1;font-family:'IBM Plex Mono',monospace;font-size:1.45cqw;letter-spacing:.24em;text-transform:uppercase;color:var(--red)}
.gk-promo b{font-family:'Fraunces',serif;font-weight:900;font-size:4.6cqw;line-height:1;color:var(--red);white-space:nowrap}
.gk-promo span{font-size:1.8cqw;line-height:1.4;color:var(--ink-2)}
.gk-promo .mono{font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--ink);letter-spacing:.06em}
.gk.has-promo .gk-body{gap:1.5cqw;padding-top:3.4cqw}
.gk.has-promo .gk-title{font-size:6.6cqw}
.gk.has-promo .gk-stamp{top:1.6cqw;transform:rotate(-11deg) scale(.8);transform-origin:top right}
.gk.has-promo .gk-steps li{padding-top:1.2cqw}
.gk.has-promo .gk-steps{margin-bottom:0}
.gk.has-promo .gk-card textarea{height:8.8cqw}
/* Einsatzbefehl */
.gk-steps{list-style:none;margin:0 0 2.4cqw;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:3cqw;counter-reset:s}
.gk-steps li{counter-increment:s;font-size:1.95cqw;line-height:1.45;border-top:.25cqw solid var(--ink);padding-top:1.6cqw}
.gk-steps li::before{content:counter(s,decimal-leading-zero);display:block;font-family:'IBM Plex Mono',monospace;font-size:1.6cqw;letter-spacing:.2em;color:var(--red);margin-bottom:.8cqw}
.gk-steps .mono{font-family:'IBM Plex Mono',monospace;font-size:.9em;word-break:break-all}
.gk-foot{margin-top:auto;display:flex;justify-content:space-between;gap:3cqw;align-items:center;padding:2.6cqw 6cqw;border-top:.25cqw dashed var(--ink-2);font-family:'IBM Plex Mono',monospace;font-size:1.55cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.gk-foot b{color:var(--ink);font-weight:500}
.gk input:focus-visible,.gk textarea:focus-visible{outline:.3cqw solid var(--red);outline-offset:.6cqw}
.gk input::placeholder,.gk textarea::placeholder{color:rgba(63,66,74,.45);font-weight:400}
/* Safari/Chrome-Autofill färbt Felder gelb – mit Papierfarbe übermalen */
.gk input:-webkit-autofill,.gk input:-webkit-autofill:hover,.gk input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 100cqw var(--paper) inset;box-shadow:0 0 0 100cqw var(--paper) inset;-webkit-text-fill-color:var(--ink);transition:background-color 9999s}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff;margin:0}
  .header,.footer,.gk-bar,.noprint{display:none!important}
  .gk-wrap{max-width:none;margin:0;padding:0}
  /* Blatt füllt den druckbaren Bereich und behält das A4-Verhältnis – passt auch, wenn der Browser (Safari) eigene Ränder druckt */
  html,body{height:auto}
  /* 90 % Breite: passt auch, wenn Safari (iPhone/Mac) Ränder plus Kopf- und Fußzeile mit Adresse und Datum druckt */
  .gk-sheet{width:90%;margin:0 auto;break-inside:avoid;page-break-inside:avoid}
  .gk{width:100%;height:auto;aspect-ratio:210/297;box-shadow:none}
  .gk input::placeholder,.gk textarea::placeholder{color:transparent;-webkit-text-fill-color:transparent}
  .gk input,.gk input:-webkit-autofill{-webkit-box-shadow:0 0 0 100cqw var(--paper) inset;box-shadow:0 0 0 100cqw var(--paper) inset;-webkit-text-fill-color:var(--ink)}
  .gk input:focus-visible,.gk textarea:focus-visible{outline:none}
}
</style>
</head>
<body>
<div class="gk-bar noprint">
<p id="gk-hint">Trag eine Widmung ein und drück auf „Drucken / als PDF“. Im Druckdialog kannst du „Als PDF sichern“ wählen und die Karte per E-Mail verschicken.</p>
<button class="btn btn-red" type="button" id="gk-print" hidden>Drucken / als PDF</button>
</div>
<div class="gk-wrap" id="gk-root"><p class="gk-msg">Geschenkkarte wird geladen …</p></div>
<script src="/spiel/qrcode.js"></script>
<script src="/assets/geschenk.js"></script>
</body>
</html>
