<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111215">
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/spiel/spiel.css">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<title>Mordsteam Solo</title>
</head>
<body class="app desk solo">
<header class="bar noprint">
<div class="wrap">
<span class="brand"><svg width="26" height="26" viewBox="0 0 34 34" fill="none" stroke="#F3EFE6" stroke-width="3" aria-hidden="true"><circle cx="14" cy="14" r="10"/><line x1="21.5" y1="21.5" x2="31" y2="31" stroke-linecap="round"/><circle cx="14" cy="14" r="3.5" fill="#B3261E" stroke="none"/></svg>
<span class="brandbox"><small id="fallname">Mordsteam Solo</small><strong id="pname">Mordsteam Solo</strong></span></span>
<span class="clock" id="clock" aria-live="off"></span>
</div>
<nav class="tabs" id="tabs" role="tablist" hidden>
<div class="wrap">
<button type="button" role="tab" data-tab="einsatz">Einsatz</button>
<button type="button" role="tab" data-tab="akte">Akte <span class="fbadge" id="newbadge" hidden></span></button>
<button type="button" role="tab" data-tab="fragen">Fragen</button>
<button type="button" role="tab" data-tab="verhoer" id="vtab" hidden>Verhör <span class="fbadge" id="vbadge" hidden>!</span></button>
</div>
</nav>
</header>
<main class="view"><div class="wrap" id="root"><p class="ondesk">Lade…</p></div></main>
<div class="toast" id="toast" role="status" hidden></div>
<div class="testbar noprint" id="testbar" hidden><span>TEST</span><button type="button" id="ff5">+5 Min.</button></div>
<script src="/spiel/common.js"></script>
<script src="/spiel/solo.js"></script>
</body>
</html>
